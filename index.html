ie')}</h3><form id="entity">${field('name','Nom / Identifiant','text',v.name,true)}${field('brand','Marque / Modèle','text',[v.brand,v.model].filter(Boolean).join(' '))}${field('type','Type de batterie',['','LiPo','LiHV','NiMH','NiCd','LiFe','Li-ion','Autre'],v.type||'')}${field('capacity','Capacité (mAh)','number',v.capacity)}<div class="battery-specs"><div>${field('cells','Cellules (S)','number',v.cells)}</div><div>${field('rating','Décharge (C)','number',v.rating)}</div></div><label for="shorty" class="battery-shorty"><input type="checkbox" id="shorty" name="shorty"  ${v.shorty===true?'checked':''}><span style="text-decoration:none">Shorty</span></label><div class="actions"><button class="primary">${tr(editing?'Enregistrer les modifications':'Ajouter')}</button><button type="button" id="cancelEntity">${tr('Annuler')}</button></div></form></section>`:`<button class="primary entity-add" onclick="addEntity()">+ ${tr('Ajouter une batterie')}</button>`}`;if(!editing&&!entityAdd)return;$('cancelEntity').onclick=()=>{entityEdit=null;entityAdd=false;render()};$('entity').onsubmit=e=>{e.preventDefault();let values=Object.fromEntries(new FormData(e.target)),old=db.batteries.slice();values.shorty=$('shorty').checked;values.model='';if(editing){let i=db.batteries.findIndex(b=>b.id===editing.id);db.batteries[i]={...editing,...values}}else db.batteries.push({...values,id:uid()});if(save()){entityEdit=null;entityAdd=false;render()}else db.batteries=old}}
function graph(r){let vals=r.map(x=>Number(x.lap)),lo=Math.min(...vals)-.05,hi=Math.max(...vals)+.05,pts=vals.map((v,i)=>[35+i*285/Math.max(1,vals.length-1),15+(hi-v)*120/(hi-lo)]);return `<svg viewBox="0 0 350 165" role="img" aria-label="${tr('Évolution des chronos')}"><text x="0" y="12" fill="#aaa" font-size="10">${hi.toFixed(2)}</text><text x="0" y="145" fill="#aaa" font-size="10">${lo.toFixed(2)}</text><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#ff8a32" stroke-width="3"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#ff8a32"/>`).join('')}</svg>`}function compare(){let a=db.runs.find(r=>r.id===$('a').value),b=db.runs.find(r=>r.id===$('b').value);if(!a||!b)return;if(a.car!==b.car||a.track!==b.track){$('comparison').textContent=tr("Choisissez deux sessions de la même voiture sur le même tracé.");return}const order=['spring','shock','bar','diff','wheelbase'];const rows=[['battery','Batterie'],['batteryBrand','Marque / Modèle'],['batteryType','Type de batterie'],['batteryCapacity','Capacité (mAh)'],['batteryCells','Cellules (S)'],['batteryRating','Décharge (C)'],['batteryShorty','Shorty'],['motor','Moteur'],['esc','ESC'],...fields.filter(f=>!order.includes(f[0])&&!['heightF','heightR','pinion','spur','note','frontProduct','rearProduct','frontWipe','rearWipe'].includes(f[0])),['commonProduct','Traitement'],...order.map(k=>fields.find(f=>f[0]===k)),...['heightF','heightR','pinion','spur','note'].map(k=>fields.find(f=>f[0]===k))];const val=(r,k)=>k==='commonProduct'?productValue(r):k.startsWith('battery')?batteryCompareValue(r,k):r[k]??'';const missing=v=>v==null||String(v).trim()===''||String(v).trim()==='Non renseigné';const cell=(r,k,t,side)=>k==='commonProduct'?esc(val(r,k)||'—'):k==='note'?(String(r.note||'').trim()?`<button class="noteButton" type="button" data-note="${side}" aria-label="${esc(tr('Commentaires')+' '+side)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v13 rt||!end||busy)return;busy=true;scan.disabled=true;status.textContent=tr('Analyse en cours…');let worker;try{const x=Math.min(start.x,end.x),y=Math.min(start.y,end.y),w=Math.abs(end.x-start.x),h=Math.abs(end.y-start.y),crop=document.createElement('canvas');const scale=Math.min(3,2400/Math.max(w,h));crop.width=Math.max(1,Math.round(w*scale));crop.height=Math.max(1,Math.round(h*scale));const g=crop.getContext('2d');g.drawImage(img,x*img.width/c.width,y*img.height/c.height,w*img.width/c.width,h*img.height/c.height,0,0,crop.width,crop.height);const pixels=g.getImageData(0,0,crop.width,crop.height);for(let i=0;i<pixels.data.length;i+=4){const a=pixels.data;const v=Math.max(0,Math.min(255,(.299*a[i]+.587*a[i+1]+.114*a[i+2]-128)*1.5+128));a[i]=a[i+1]=a[i+2]=v}g.putImageData(pixels,0,0);await prepareOCR((n,total)=>{status.textContent=tr('Préparation OCR')+' '+Math.round(n/total*100)+' %'});const T=await loadOCR();worker=await T.createWorker('eng',1,{workerPath:OCR_URLS[1],corePath:OCR_URLS[2],langPath:OCR_URLS[4].slice(0,OCR_URLS[4].lastIndexOf('/')),logger:m=>{status.textContent=(m.status==='recognizing text'?tr('Analyse en cours…'):tr('Préparation OCR')+' — '+m.status)+' '+Math.round((m.progress||0)*100)+' %'},errorHandler:e=>{status.textContent=String(e?.message||e)}});await worker.setParameters({tessedit_char_whitelist:'0123456789.,',tessedit_pageseg_mode:'6'});const result=await worker.recognize(crop);const lines=result.data.text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);values=lines;showRows();status.textContent=tr('Vérifiez chaque chrono avant de valider.')+' '+tr(!navigator.onLine&&navigator.serviceWorker?.controller?'OCR disponible hors connexion':'OCR : téléchargement terminé, hors connexion à vérifier')}catch(e){status.textContent=tr('OCR indisponible ou en échec. Saisissez les temps manuellement.')+' — '+String(e?.message||e)}finally{if(worker)await worker.terminate().catch(()=>{});busy=false;scan.disabled=false}};q('[data-ok]').onclick=()=>{if(busy)return
