function graph(r){let vals=r.map(x=>Number(x.lap)),lo=Math.min(...vals)-.05,hi=Math.max(...vals)+.05,pts=vals.map((v,i)=>[35+i*285/Math.max(1,vals.length-1),15+(hi-v)*120/(hi-lo)]);return `<svg viewBox="0 0 350 165" role="img" aria-label="${tr('Évolution des chronos')}"><text x="0" y="12" fill="#aaa" font-size="10">${hi.toFixed(2)}</text><text x="0" y="145" fill="#aaa" font-size="10">${lo.toFixed(2)}</text><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#ff8a32" stroke-width="3"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#ff8a32"/>`).join('')}</svg>`}function compare(){let a=db.runs.find(r=>r.id===$('a').value),b=db.runs.find(r=>r.id===$('b').value);if(!a||!b)return;if(a.car!==b.car||a.track!==b.track){$('comparison').textContent=tr("Choisissez deux sessions de la même voiture sur le même tracé.");return}const order=['spring','shock','bar','diff'];const rows=[['battery','Batterie'],['batteryBrand','Marque / Modèle'],['batteryType','Type de batterie'],['batteryCapacity','Capacité (mAh)'],['batteryCells','Cellules (S)'],['batteryRating','Décharge (C)'],['batteryShorty','Shorty'],['motor','Moteur'],['esc','ESC'],...fields.filter(f=>!order.includes(f[0])&&!['heightF','heightR','pinion','spur','note','frontProduct','rearProduct','frontWipe','rearWipe'].includes(f[0])),['commonProduct','Traitement'],...order.map(k=>fields.find(f=>f[0]===k)),...['heightF','heightR','pinion','spur','note'].map(k=>fields.find(f=>f[0]===k))];const val=(r,k)=>k==='commonProduct'?productValue(r):k.startsWith('battery')?batteryCompareValue(r,k):r[k]??'';const missing=v=>v==null||String(v).trim()===''||String(v).trim()==='Non renseigné';const cell=(r,k,t,side)=>k==='commonProduct'?esc(val(r,k)||'—'):k==='note'?(String(r.note||'').trim()?`<button class="noteButton" type="button" data-note="${side}" aria-label="${esc(tr('Commentaires')+' '+side)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v13H9l-5 4z"/></svg></button>`:'—'):esc(Array.isArray(t)?tr(missing(val(r,k))?'—':val(r,k)):missing(val(r,k))?'—':val(r,k));$('comparison').innerHTML=`<p>${tr("Écart B − A : ")}${hasLap(a.lap)&&hasLap(b.lap)?(Number(b.lap)-Number(a.lap)).toFixed(3)+" s":"—"}</p><table><colgroup><col style="width:40%"><col style="width:30%"><col style="width:30%"></colgroup><tr><th>${tr("Réglage")}</th><th>A</th><th>B</th></tr><tr class="compare-section"><th colspan="3"><div class="section-heading">${sectionHeading("Performances")}</div></th></tr><tr class="${time(a.lap)!==time(b.lap)?'changed':''}"><td>${tr('Meilleur tour')}</td><td>${esc(time(a.lap))}</td><td>${esc(time(b.lap))}</td></tr>${hasLaps(a.laps)||hasLaps(b.laps)?`<tr class="${lapCount(a.laps)!==lapCount(b.laps)?'changed':''}"><td>${tr('Nombre de tours')}</td><td>${lapCount(a.laps)}</td><td>${lapCount(b.laps)}</td></tr>`:''}${['Électronique','Pneus','Châssis','Transmission','Commentaires'].map(group=>{const groupOf=k=>k.startsWith('battery')||['motor','esc'].includes(k)?'Électronique':order.includes(k)||['heightF','heightR'].includes(k)?'Châssis':['pinion','spur'].includes(k)?'Transmission':k==='note'?'Commentaires':'Pneus';const visible=rows.filter(([k])=>groupOf(k)===group&&(!missing(val(a,k))||!missing(val(b,k))));return visible.length?`<tr class="compare-section"><th colspan="3"><div class="section-heading">${sectionHeading(group)}</div></th></tr>${visible.map(([k,l,t])=>`<tr class="${val(a,k)!==val(b,k)?'changed':''}"><td>${tr(l)}</td><td>${cell(a,k,t,'A')}</td><td>${cell(b,k,t,'B')}</td></tr>`).join('')}`:''}).join('')}</table><dialog id="compareNote"><h3 id="compareNoteTitle"></h3><p id="compareNoteText"></p><form method="dialog"><button class="primary">${esc(({fr:'Fermer',en:'Close',de:'Schließen',it:'Chiudi',es:'Cerrar'})[lang])}</button></form></dialog>`;$('comparison').querySelectorAll('[data-note]').forEach(btn=>btn.onclick=()=>{const side=btn.dataset.note,r=side==='A'?a:b;$('compareNoteTitle').textContent=tr('Commentaires')+' — '+side;$('compareNoteText').textContent=r.note;$('compareNote').showModal()});}function removeRun(id){const r=db.runs.find(x=>x.id===id);if(!r)return;const d=document.createElement('dialog');d.className='delete-dialog';d.setAttribute('aria-labelledby','deleteRunTitle');const warning=({fr:'Cette action est définitive et ne peut pas être annulée.',en:'This action is permanent and cannot be undone.',de:'Diese Aktion ist endgültig und kann nicht rückgängig gemacht werden.',it:'Questa azione è definitiva e non può essere annullata.',es:'Esta acción es definitiva y no se puede deshacer.'})[lang];d.innerHTML=`<div style="color:#ef7777"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg></div><h3 id="deleteRunTitle">${esc(tr('Supprimer cette session ?'))}</h3><p>${esc(sessionLabel(r))} · ${esc(r.date)}</p><p class="delete-lap">${esc(time(r.lap))}</p><p>${esc(warning)}</p><form method="dialog" class="delete-actions"><button value="cancel" autofocus>${esc(tr('Annuler'))}</button><button class="delete-confirm" value="delete">${esc(tr('Supprimer'))}</button></form>`;document.body.appendChild(d);d.addEventListener('close',()=>{const confirmed=d.returnValue==='delete';d.remove();if(confirmed){db.runs=db.runs.filter(x=>x.id!==id);save();render()}},{once:true});d.showModal()}function removeEntity(k,id){if(db.runs.some(r=>r[k==='cars'?'car':k==='batteries'?'battery':'track']===id)){alert(tr("Cet élément est utilisé dans des sessions."));return}if(confirm(tr("Supprimer ?"))){db[k]=db[k].filter(x=>x.id!==id);save();render()}}function exportDB(){let u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='rc-setup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.warn);
let rcInstallPrompt=null;

 const d=document.createElement('dialog');d.className='install-dialog';
 const installed=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 d.innerHTML=`<h3>${esc(tr('Instructions d’installation'))}</h3>${installed?`<p>${esc(tr('L’application est déjà ouverte en mode installé.'))}</p>`:`<p>${esc(tr('Sur iPhone : ouvrez cette page dans Safari, touchez Partager, puis Sur l’écran d’accueil et Ajouter.'))}</p><p>${esc(tr('Sur Android : ouvrez cette page dans Chrome, touchez ⋮, puis Installer l’application ou Ajouter à l’écran d’accueil.'))}</p>`}<form method="dialog"><button class="primary">${esc(tr('Fermer'))}</button></form>`;
 document.body.appendChild(d);d.addEventListener('close',()=>d.remove(),{once:true});d.showModal();
}
