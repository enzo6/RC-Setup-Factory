<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>RC Setup Tracker</title><style> *{box-sizing:border-box}body{margin:0;background:#171717;color:#eee;font:16px system-ui}main,header{max-width:760px;margin:auto;padding:16px}header{color:#ff8a32;font-weight:900;font-size:24px}nav{position:sticky;top:0;background:#222;display:flex;flex-wrap:wrap;justify-content:center;z-index:2}button,input,select,textarea{font:inherit;border-radius:8px;padding:12px;border:1px solid #555;background:#292929;color:white}button{cursor:pointer}button.primary,nav button.active{background:#ff8a32;color:#171717;font-weight:bold}nav button{border:0;padding:12px 9px}section,article{background:#242424;border-radius:12px;padding:16px;margin:12px 0}label{display:block;margin:12px 0 4px;color:#ccc}input,select,textarea{width:100%}h2,h3{color:#ff8a32}h3{margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}small{color:#aaa}table{width:100%;border-collapse:collapse;overflow-wrap:anywhere}td,th{padding:8px;border-bottom:1px solid #555;text-align:left} .changed{color:#ff8a32} svg{width:100%;height:auto} body{color-scheme:dark}header{display:flex;align-items:center;justify-content:space-between;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:12px;border-bottom:1px solid #303030}header small{display:block;font-size:10px;letter-spacing:1.5px;font-weight:500;margin-top:4px}header button{border:0;background:transparent;font-size:24px;padding:8px}main{padding-bottom:calc(100px + env(safe-area-inset-bottom))}nav{position:fixed;top:auto;bottom:0;left:0;right:0;flex-wrap:nowrap;background:#202020;border-top:1px solid #393939;padding:8px 4px calc(8px + env(safe-area-inset-bottom));justify-content:center}nav button{flex:1;max-width:152px;background:transparent;color:#aaa;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;padding:8px 0;font-weight:500}nav button.active{background:transparent;color:#ff8a32}nav svg{width:24px;height:24px}h2{color:#eee;font-size:24px}section,article{border-radius:16px}button.primary{width:100%}.metric{font-size:26px;font-weight:800;color:#ff8a32;margin:8px 0}.manage{display:block;width:100%;text-align:left;margin:10px 0;padding:18px}.manage span{float:right;color:#ff8a32}.history-tabs{display:flex;gap:5px;flex-wrap:nowrap}.history-tabs button{flex:1;padding:10px 4px;font-size:13px}.history-tabs .selected{color:#ff8a32;border-color:#ff8a32}nav button{max-width:250px}</style><header><div><strong>RC / SETUP</strong><small>PERFORMANCE TRACKER · V1.3</small></div></header><nav id="nav"></nav><main id="app"></main><script>
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.getItem('rc-v1'))||{cars:[],tracks:[],runs:[]}}catch{db={cars:[],tracks:[],runs:[]}}let page='Accueil',draft=null,filterCar='',filterTrack='',historyTab='Historique';try{let p=JSON.parse(localStorage.getItem('rc-active')||'{}');filterCar=db.cars.some(x=>x.id===p.car)?p.car:'';filterTrack=db.tracks.some(x=>x.id===p.track)?p.track:''}catch{}function remember(){try{localStorage.setItem('rc-active',JSON.stringify({car:filterCar,track:filterTrack}))}catch{}}const save=()=>{try{localStorage.setItem('rc-v1',JSON.stringify(db));return true}catch{alert('Sauvegarde impossible : exportez vos données.');return false}},uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10), name=(list,id)=>list.find(x=>x.id===id)?.name||'—', time=x=>Number(x).toFixed(3)+' s';
const fields=[['front','Pneus avant – référence'],['frontShore','Shore avant','number'],['frontDia','Diamètre avant (mm)','number'],['frontProduct','Traitement avant – produit'],['frontZone','Largeur traitée avant',['','Aucun','25 %','50 %','75 %','100 %']],['frontMin','Durée avant (min)','number'],['frontWipe','Essuyage avant',['','Oui','Non']],['rear','Pneus arrière – référence'],['rearShore','Shore arrière','number'],['rearDia','Diamètre arrière (mm)','number'],['rearProduct','Traitement arrière – produit'],['rearZone','Largeur traitée arrière',['','Aucun','25 %','50 %','75 %','100 %']],['rearMin','Durée arrière (min)','number'],['rearWipe','Essuyage arrière',['','Oui','Non']],['diff','Différentiel',['','Souple','Moyen','Dur']],['bar','T-Bar',['','Souple','Moyen','Dur']],['spring','Ressorts avant',['','Souple','Moyen','Dur']],['heightF','Garde au sol AV (mm)','number'],['heightR','Garde au sol AR (mm)','number'],['pinion','Pignon (dents)','number'],['spur','Couronne (dents)','number'],['note','Commentaires','textarea']];
function field(k,l,t='text',v='',required=false){return `<label for="${k}">${l}</label>${Array.isArray(t)?`<select id="${k}" name="${k}" ${required?'required':''}>${t.map(x=>{let [a,b]=Array.isArray(x)?x:[x,x];return `<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b||'—')}</option>`}).join('')}</select>`:t==='textarea'?`<textarea id="${k}" name="${k}">${esc(v)}</textarea>`:`<input id="${k}" name="${k}" type="${t}" ${t==='number'?'step="any" min="0"':''} value="${esc(v)}" ${required?'required':''}>`}`}
const opts=list=>[['','Sélectionner'],...list.map(x=>[x.id,x.name])];let entityEdit=null;function go(p){entityEdit=null;page=p;render();window.scrollTo(0,0)}function historyView(p){historyTab=p;go(p)}function editEntity(key,index){entityEdit={key,id:db[key][index].id};render();window.scrollTo(0,0)}function newRun(car='',track=''){let last=[...db.runs].reverse().find(r=>r.car===car&&r.track===track)||[...db.runs].reverse().find(r=>r.car===car);draft={...last,id:'',date:today(),car,track,lap:'',note:''};go('Setup')}function edit(id,copy=false){draft={...db.runs.find(r=>r.id===id)};if(copy){draft.id='';draft.date=today();draft.lap='';draft.note=''}go('Setup')}
function render(){ const icons=['<path d="m3 10 9-7 9 7v10H3z M9 20v-7h6v7"/>','<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="#202020"/><circle cx="16" cy="12" r="2" fill="#202020"/><circle cx="10" cy="18" r="2" fill="#202020"/>','<path d="M3 12a9 9 0 1 0 3-7L3 8m0-5v5h5m4-1v5l4 2"/>','<path d="M3 3v18h18M7 15l5-5 4 2 5-7"/>','<path d="M4 6h16M4 12h16M4 18h16"/>'];$('nav').innerHTML=['Accueil','Historique','Plus'].map((p,i)=>`<button class="${p===page||(p==='Accueil'&&page==='Setup')||(p==='Historique'&&['Statistiques','Comparer'].includes(page))||(p==='Plus'&&['Garage','Circuits','Sauvegarde'].includes(page))?'active':''}" onclick="go('${p}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[[0,2,4][i]]}</svg>${({Accueil:'Rouler',Historique:'Historique',Plus:'Gestion'})[p]}</button>`).join('');let a=$('app');if(page==='Plus'){a.innerHTML=`<h2>Gestion</h2>${['Garage','Circuits','Sauvegarde'].map(p=>`<button class="manage" onclick="go('${p}')">${p}<span>›</span></button>`).join('')}`;return}if(page==='Garage'||page==='Circuits'){let cars=page==='Garage',key=cars?'cars':'tracks',editing=entityEdit?.key===key?db[key].find(x=>x.id===entityEdit.id):null,v=editing||{};a.innerHTML=`<h2>${page}</h2><section><h3>${editing?'Modifier':'Ajouter'} ${cars?'une voiture':'un circuit'}</h3><form id="entity">${field('name',cars?'Nom de la voiture':'Nom du tracé','text',v.name,true)}${cars?field('brand','Marque','text',v.brand)+field('model','Modèle','text',v.model)+field('scale','Échelle',['','1/10','1/12','1/8','1/18','Autre'],v.scale):field('venue','Club / lieu','text',v.venue,true)+field('surface','Revêtement',['Moquette','Asphalte','Béton','Terre','Autre'],v.surface||'Moquette')+field('type','Type',['Indoor','Outdoor'],v.type||'Indoor')+field('start','Mise en service','date',v.start??today())}${field('note','Commentaires','textarea',v.note)}<div class="actions"><button class="primary">${editing?'Enregistrer les modifications':'Ajouter'}</button>${editing?'<button type="button" id="cancelEntity">Annuler</button>':''}</div></form></section>${db[key].map((x,i)=>`<article><b>${esc(x.name)}</b><p>${esc(cars?[x.brand,x.model,x.scale].join(' '):[x.venue,x.surface,x.type].join(' · '))}</p><small>${esc(x.note)}</small><div class="actions"><button style="color:#ff8a32" onclick="editEntity('${key}',${i})">Modifier</button><button onclick="removeEntity('${key}','${esc(x.id)}')">Supprimer</button></div></article>`).join('')}`;if(editing)$('cancelEntity').onclick=()=>{entityEdit=null;render()};$('entity').onsubmit=e=>{e.preventDefault();let values=Object.fromEntries(new FormData(e.target)),old=db[key].slice();if(editing){let i=db[key].findIndex(x=>x.id===editing.id);if(i<0)return;db[key][i]={...editing,...values,id:editing.id}}else db[key].push({...values,id:uid()});if(save()){entityEdit=null;render()}else db[key]=old};return}
if(page==='Setup'){if(!db.cars.length||!db.tracks.length){a.innerHTML='<h2>Nouvelle session</h2><p>Ajoutez d’abord une voiture et un circuit.</p><button onclick="go(\'Garage\')">Garage</button> <button onclick="go(\'Circuits\')">Circuits</button>';return}if(!draft)draft={date:today(),car:filterCar,track:filterTrack};a.innerHTML=`<h2>${draft.id?'Modifier':'Nouvelle'} session</h2><form id="run"><section>${field('car','Voiture',opts(db.cars),draft.car,true)}${field('track','Circuit / tracé',opts(db.tracks),draft.track,true)}${field('date','Date','date',draft.date,true)}<button type="button" onclick="newRun($('car').value,$('track').value)">Reprendre le dernier setup</button></section><section><h3>Performances</h3>${field('lap','Meilleur tour (secondes)','number',draft.lap,true)}</section>${[fields.slice(0,7),fields.slice(7,14),fields.slice(14,19),fields.slice(19,21),fields.slice(21)].map((g,i)=>`<section><h3>${['Pneus avant','Pneus arrière','Châssis','Transmission','Ressenti'][i]}</h3>${g.map(([k,l,t])=>field(k,l,t,draft[k])).join('')}${i===3?'<p id="ratio"></p>':''}</section>`).join('')}<button class="primary">Enregistrer la session</button></form>`;let ratio=()=>{$('ratio').textContent='Rapport couronne / pignon : '+(Number($('pinion').value)>0&&Number($('spur').value)>0?(Number($('spur').value)/Number($('pinion').value)).toFixed(2):'—')};$('pinion').oninput=$('spur').oninput=ratio;ratio();$('run').onsubmit=e=>{e.preventDefault();let r=Object.fromEntries(new FormData(e.target));if(!(Number(r.lap)>0)){alert('Chrono strictement positif requis');return}r.id=draft.id||uid();let i=db.runs.findIndex(x=>x.id===r.id);if(i<0)db.runs.push(r);else db.runs[i]=r;if(save()){draft=null;filterCar=r.car;filterTrack=r.track;remember();go('Accueil')}};return}
if(page==='Sauvegarde'){a.innerHTML='<h2>Sauvegarde</h2><section><p>Exportez régulièrement vos données. Elles restent sur cet appareil et peuvent être effacées par le navigateur.</p><button onclick="exportDB()">Exporter JSON</button><label>Importer (remplace les données)</label><input type="file" id="import" accept=".json,application/json"></section>';$('import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!['cars','tracks','runs'].every(k=>Array.isArray(d[k])&&d[k].every(x=>x&&typeof x.id==='string'))||!d.runs.every(r=>Number(r.lap)>0&&d.cars.some(c=>c.id===r.car)&&d.tracks.some(t=>t.id===r.track)))throw Error();if(confirm('Remplacer toutes les données ?')){db=d;save();draft=null;filterCar=filterTrack='';remember();go('Accueil')}}catch{alert('Fichier invalide')}};return}
if(!db.cars.some(x=>x.id===filterCar))filterCar=db.cars.length===1?db.cars[0].id:'';if(!db.tracks.some(x=>x.id===filterTrack))filterTrack=db.tracks.length===1?db.tracks[0].id:'';let runs=db.runs.filter(r=>(!filterCar||r.car===filterCar)&&(!filterTrack||r.track===filterTrack)).sort((a,b)=>a.date.localeCompare(b.date));let filters=field('fc','Voiture',[['','Toutes'],...opts(db.cars).slice(1)],filterCar)+field('ft','Circuit / tracé',[['','Tous'],...opts(db.tracks).slice(1)],filterTrack);let comparable=filterCar&&filterTrack;let best=comparable&&runs.length?[...runs].sort((a,b)=>Number(a.lap)-Number(b.lap))[0]:null;a.innerHTML=`<h2>${page==='Accueil'?'Prêt à rouler ?':'Historique'}</h2><section>${filters}</section>${page!=='Accueil'?`<div class="actions history-tabs">${[['Historique','Sessions'],['Statistiques','Statistiques'],['Comparer','Comparer']].map(([p,l])=>`<button class="${page===p?'selected':''}" onclick="historyView('${p}')">${l}</button>`).join('')}</div>`:''}${page==='Accueil'?`<div class="grid"><section><small>Record personnel</small><div class="metric">${best?time(best.lap):'—'}</div></section><section><small>Dernier tour</small><div class="metric">${comparable&&runs.length?time(runs[runs.length-1].lap):'—'}</div></section></div>${!comparable?'<p><small>Sélectionnez une voiture et un tracé pour afficher le record.</small></p>':''}<button class="primary" onclick="newRun(filterCar,filterTrack)">+ Nouvelle session</button>`:''}${page==='Statistiques'?`<section>${best?`<h3>Record : ${time(best.lap)}</h3><p>Gain depuis la première session : ${((1-Number(best.lap)/Number(runs[0].lap))*100).toFixed(2)} %</p>${graph(runs)}<button onclick="edit('${esc(best.id)}')">Voir le meilleur setup</button>`:'Sélectionnez une voiture et un tracé contenant des sessions.'}</section>`:''}${page==='Comparer'?`<section><h3>Comparer deux setups</h3>${field('a','Setup A',opts(runs.map(r=>({...r,name:r.date+' · '+time(r.lap)}))))}${field('b','Setup B',opts(runs.map(r=>({...r,name:r.date+' · '+time(r.lap)}))))}<div class="actions"><button onclick="compare()">Comparer</button></div><div id="comparison"></div></section>`:''}${page==='Historique'?`${[...runs].reverse().map(r=>`<article><h3>${time(r.lap)}</h3><p>${esc(r.date)} · ${esc(name(db.cars,r.car))} · ${esc(name(db.tracks,r.track))}</p><small>${esc(r.note)}</small><div class="actions"><button onclick="edit('${esc(r.id)}')">Voir / modifier</button><button onclick="edit('${esc(r.id)}',true)">Dupliquer</button><button onclick="removeRun('${esc(r.id)}')">Supprimer</button></div></article>`).join('')}`:''}`;$('fc').onchange=e=>{filterCar=e.target.value;remember();render()};$('ft').onchange=e=>{filterTrack=e.target.value;remember();render()}}
function graph(r){let vals=r.map(x=>Number(x.lap)),lo=Math.min(...vals)-.05,hi=Math.max(...vals)+.05,pts=vals.map((v,i)=>[35+i*285/Math.max(1,vals.length-1),15+(hi-v)*120/(hi-lo)]);return `<svg viewBox="0 0 350 165" role="img" aria-label="Évolution des chronos"><text x="0" y="12" fill="#aaa" font-size="10">${hi.toFixed(2)}</text><text x="0" y="145" fill="#aaa" font-size="10">${lo.toFixed(2)}</text><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#ff8a32" stroke-width="3"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#ff8a32"/>`).join('')}</svg>`}function compare(){let a=db.runs.find(r=>r.id===$('a').value),b=db.runs.find(r=>r.id===$('b').value);if(!a||!b)return;if(a.car!==b.car||a.track!==b.track){$('comparison').textContent='Choisissez deux sessions de la même voiture sur le même tracé.';return}$('comparison').innerHTML=`<p>Écart B − A : ${(Number(b.lap)-Number(a.lap)).toFixed(3)} s</p><table><tr><th>Réglage</th><th>A</th><th>B</th></tr>${fields.map(([k,l])=>`<tr class="${a[k]!==b[k]?'changed':''}"><td>${l}</td><td>${esc(a[k]||'—')}</td><td>${esc(b[k]||'—')}</td></tr>`).join('')}</table>`}function removeRun(id){if(confirm('Supprimer cette session ?')){db.runs=db.runs.filter(r=>r.id!==id);save();render()}}function removeEntity(k,id){if(db.runs.some(r=>r[k==='cars'?'car':'track']===id)){alert('Cet élément est utilisé dans des sessions.');return}if(confirm('Supprimer ?')){db[k]=db[k].filter(x=>x.id!==id);save();render()}}function exportDB(){let u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='rc-setup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></html>
